# ── Database (Render / local) ───────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ideaforge_db}
spring.datasource.username=root
spring.datasource.password=Hem@2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}

# JWT (must be >= 32 bytes for HS256 — override in production)
ideaforge.jwt.secret=${JWT_SECRET:ideaforge_dev_only_change_me_use_64_char_random_string_in_prod}
ideaforge.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# Extra CORS origins (comma-separated exact URLs), merged with localhost + Vercel patterns in SecurityConfig
ideaforge.cors.allowed-origins=${CORS_ORIGINS:}

# Upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true